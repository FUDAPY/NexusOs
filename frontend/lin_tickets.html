<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1LZVQ05T2E"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusOS - Lin Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nexus-theme-toggle.js"></script>
    <link rel="stylesheet" href="nexus.css">
    <link rel="stylesheet" href="nexus-theme.css">
    <script src="nexus-api.js"></script>
    <script src="nexus-auth.js"></script>
    <script src="nexus-data.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
    <div id="app-body" class="opacity-0 transition-opacity">
        <header class="bg-slate-950 text-white px-6 py-4 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-xl font-black">LIN Tickets</h1>
                    <p class="text-xs text-slate-400">Premios canjeables con puntos de clientes</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="hidden sm:block text-right leading-tight">
                    <p id="user-name" class="text-sm font-bold text-white">Cargando...</p>
                    <p id="user-role" class="text-[10px] text-slate-400 uppercase">...</p>
                </div>
                <button onclick="LinTicketsModule.cerrarSesion()" class="w-11 h-11 rounded-xl bg-red-500/15 text-red-300 hover:bg-red-500/25 transition" title="Cerrar sesión" aria-label="Cerrar sesión">
                    <i class="fa-solid fa-power-off"></i>
                </button>
                <button onclick="LinTicketsModule.abrirModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-black shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    Nuevo ticket
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <p class="text-xs font-black uppercase text-slate-400">Tickets activos</p>
                    <p id="metric-activos" class="text-3xl font-black text-emerald-600 mt-1">0</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <p class="text-xs font-black uppercase text-slate-400">Total cargados</p>
                    <p id="metric-total" class="text-3xl font-black text-slate-900 mt-1">0</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <p class="text-xs font-black uppercase text-slate-400">Menor canje</p>
                    <p id="metric-menor" class="text-3xl font-black text-orange-500 mt-1">0 pts</p>
                </div>
            </div>

            <div id="tickets-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
            <div id="empty-state" class="hidden bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400 font-bold">
                <i class="fa-solid fa-ticket text-5xl mb-4"></i>
                <p>No hay LIN Tickets cargados.</p>
            </div>
        </main>
    </div>

    <div id="modal-ticket" class="fixed inset-0 hidden items-center justify-center bg-slate-950/70 backdrop-blur-sm z-50 p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-[720px] max-w-full max-h-[92vh] overflow-hidden flex flex-col">
            <div class="bg-slate-950 text-white p-5 flex items-center justify-between">
                <h2 id="modal-title" class="text-xl font-black">Nuevo LIN Ticket</h2>
                <button onclick="LinTicketsModule.cerrarModal()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form onsubmit="LinTicketsModule.guardar(event)" class="p-6 space-y-4 overflow-y-auto">
                <input type="hidden" id="ticket-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Título</label>
                        <input id="ticket-titulo" required class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none" placeholder="Combo gratis">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Tipo de beneficio</label>
                        <select id="ticket-tipo" onchange="LinTicketsModule.actualizarCamposBeneficio()" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none bg-white font-bold">
                            <option value="free_product">Producto gratis</option>
                            <option value="discount">Descuento</option>
                            <option value="special_promo">Promocion especial</option>
                            <option value="free_points">Puntos gratis</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Descripción</label>
                    <textarea id="ticket-descripcion" rows="3" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none" placeholder="Detalle del premio o condiciones de canje"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Producto o beneficio asociado</label>
                        <input id="ticket-producto" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none" placeholder="Cafe, combo o beneficio">
                        <select id="ticket-producto-id" onchange="LinTicketsModule.sincronizarProductoTicket()" class="w-full border-2 border-emerald-200 rounded-xl p-3 focus:border-emerald-500 outline-none bg-white font-bold mt-2 hidden"></select>
                        <p id="ticket-producto-ayuda" class="text-[11px] text-emerald-700 font-bold mt-1 hidden">Para producto gratis, elegi un producto habilitado en Inventario como LIN Ticket gratis.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Puntos gratis</label>
                        <input id="ticket-puntos" type="number" min="0" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none" placeholder="500">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Fecha de inicio</label>
                        <input id="ticket-inicio" type="date" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Fecha de vencimiento</label>
                        <input id="ticket-vencimiento" type="date" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Sucursal</label>
                        <select id="ticket-sucursal" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none bg-white"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Estado</label>
                        <select id="ticket-activo" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none bg-white font-bold">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 rounded-2xl bg-slate-50 border border-slate-200 p-4">
                    <label class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-4 font-bold text-slate-700 md:col-span-2">
                        <input id="ticket-uso-unico" type="checkbox" class="w-5 h-5 accent-emerald-500" checked>
                        Una sola vez por usuario
                    </label>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-1">Condiciones visibles</label>
                        <input id="ticket-condiciones" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none" placeholder="Valido mientras dure la promo">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">URL imagen</label>
                        <input id="ticket-imagen-url" type="url" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none font-mono text-sm" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Subir imagen</label>
                        <input id="ticket-imagen-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" class="w-full bg-white border-2 border-slate-200 rounded-xl p-3 focus:border-emerald-500 outline-none text-sm">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                    <button type="button" onclick="LinTicketsModule.cerrarModal()" class="px-5 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-100">Cancelar</button>
                    <button id="btn-guardar" type="submit" class="px-6 py-3 rounded-xl font-black text-white bg-emerald-500 hover:bg-emerald-600 shadow-md flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 translate-x-[120%] bg-slate-900 text-white rounded-2xl shadow-2xl px-5 py-4 flex items-center gap-3 transition-transform z-[60]">
        <i id="toast-icon" class="fa-solid fa-check text-emerald-400"></i>
        <span id="toast-message" class="font-bold">Listo</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALS7-xIkcvY4MnSvBm44tzFk6cxyS14Eg",
            authDomain: "sys-pos-erp-lingroup.firebaseapp.com",
            projectId: "sys-pos-erp-lingroup",
            storageBucket: "sys-pos-erp-lingroup.firebasestorage.app",
            messagingSenderId: "1084603889746",
            appId: "1:1084603889746:web:822ce55a070dc146b2078b",
            measurementId: "G-1LZVQ05T2E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.LinTicketsModule = {
            tickets: [],
            branches: [],
            products: [],
            unsubTickets: null,
            unsubBranches: null,
            unsubProducts: null,

            init() {
                /* Arranque directo: onAuthStateChanged de Firebase ya no dispara. */
                if (!(window.NexusAuth && window.NexusAuth.autenticado())) {
                    window.location.replace('index.html');
                    return;
                }
                const sesionStr = localStorage.getItem('__pos_session');
                    const sesion = sesionStr ? JSON.parse(sesionStr) : null;
                    if (!sesion || sesion.rol !== 'admin') {
                        window.location.replace('index.html');
                        return;
                    }
                    document.getElementById('user-name').innerText = sesion.nombre || 'Administrador';
                    document.getElementById('user-role').innerText = `Rol: ${(sesion.rol || 'admin').toUpperCase()}`;
                    document.getElementById('app-body').classList.remove('opacity-0');
                    this.escucharSucursales();
                    this.escucharProductos();
                    this.escucharTickets();
            },

            cerrarSesion: async function() {
                await signOut(auth);
                localStorage.removeItem('__pos_session');
                window.location.replace('index.html');
            },

            async escucharSucursales() {
                
                const resp = await NexusAPI.get('/branches', { limit: 200 }, { ttl: 0, retries: 0 });
                const filas = (resp && resp.data && resp.data.items) || [];
                const snap = { docs: filas.map((d) => ({ id: String(d._id || d.id || ''), data: () => d })) };
                ((snap) => {
                    this.branches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.renderSucursalSelect();
                    this.render();
                });
            },

            async escucharTickets() {
                
                const resp = await NexusAPI.get('/lin-tickets', { limit: 500 }, { ttl: 0, retries: 0 });
                const filas = (resp && resp.data && resp.data.items) || [];
                const snap = { docs: filas.map((d) => ({ id: String(d._id || d.id || ''), data: () => d })) };
                ((snap) => {
                    this.tickets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.render();
                });
            },

            async escucharProductos() {
                
                const resp = await NexusAPI.get('/products', { limit: 500 }, { ttl: 0, retries: 0 });
                const filas = (resp && resp.data && resp.data.items) || [];
                const snap = { docs: filas.map((d) => ({ id: String(d._id || d.id || ''), data: () => d })) };
                ((snap) => {
                    this.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.renderProductoSelect();
                });
            },

            renderSucursalSelect() {
                const select = document.getElementById('ticket-sucursal');
                select.innerHTML = `<option value="all">Todas las sucursales</option>` + this.branches.map(branch => `<option value="${branch.id}">${branch.nombre || branch.branchName || branch.id}</option>`).join('');
            },

            renderProductoSelect(selectedId = '') {
                const select = document.getElementById('ticket-producto-id');
                if (!select) return;
                const productosGratis = this.products
                    .filter(p => p.estado !== 'Inactivo' && p.permiteProductoGratis === true)
                    .sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' }));
                select.innerHTML = `<option value="">Seleccionar producto del inventario</option>` + productosGratis.map(p => {
                    const precio = Number(p.precio || 0).toLocaleString('es-PY');
                    const sucursal = p.sucursal && p.sucursal !== 'Unificado' ? ` - ${p.sucursal}` : '';
                    return `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${p.nombre || p.id} · Gs. ${precio}${sucursal}</option>`;
                }).join('');
            },

            sincronizarProductoTicket() {
                const productId = document.getElementById('ticket-producto-id')?.value || '';
                const producto = this.products.find(p => p.id === productId);
                const input = document.getElementById('ticket-producto');
                if (input) input.value = producto?.nombre || '';
            },

            obtenerEtiquetaBeneficio(type) {
                const labels = {
                    free_product: 'Producto gratis',
                    discount: 'Descuento',
                    special_promo: 'Promocion especial',
                    free_points: 'Puntos gratis'
                };
                return labels[type] || labels.free_product;
            },

            normalizarFechaInput(value) {
                if (!value) return '';
                if (typeof value?.toDate === 'function') return value.toDate().toISOString().slice(0, 10);
                if (typeof value === 'string') return value.slice(0, 10);
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
            },

            actualizarCamposBeneficio() {
                const tipo = document.getElementById('ticket-tipo')?.value || 'free_product';
                const puntos = document.getElementById('ticket-puntos');
                const productoTexto = document.getElementById('ticket-producto');
                const productoSelect = document.getElementById('ticket-producto-id');
                const productoAyuda = document.getElementById('ticket-producto-ayuda');
                if (!puntos) return;
                puntos.disabled = tipo !== 'free_points';
                puntos.classList.toggle('bg-slate-100', tipo !== 'free_points');
                if (tipo !== 'free_points') puntos.value = '';
                if (productoSelect) {
                    productoSelect.classList.toggle('hidden', tipo !== 'free_product');
                    productoSelect.required = tipo === 'free_product';
                }
                if (productoAyuda) productoAyuda.classList.toggle('hidden', tipo !== 'free_product');
                if (productoTexto) {
                    productoTexto.placeholder = tipo === 'free_product' ? 'Nombre visible del premio' : 'Cafe, combo o beneficio';
                    productoTexto.readOnly = tipo === 'free_product';
                    productoTexto.classList.toggle('bg-slate-100', tipo === 'free_product');
                }
            },

            render() {
                const grid = document.getElementById('tickets-grid');
                const empty = document.getElementById('empty-state');
                const activos = this.tickets.filter(t => t.active !== false).length;
                const puntos = this.tickets.map(t => Number(t.pointsValue || t.points || 0)).filter(n => n > 0);
                document.getElementById('metric-activos').innerText = activos;
                document.getElementById('metric-total').innerText = this.tickets.length;
                document.getElementById('metric-menor').innerText = puntos.length ? `${Math.min(...puntos).toLocaleString('es-PY')} pts` : '0 pts';
                empty.classList.toggle('hidden', this.tickets.length > 0);
                grid.innerHTML = this.tickets.map(ticket => {
                    const branchName = ticket.branchId === 'all' ? 'Todas las sucursales' : (this.branches.find(b => b.id === ticket.branchId)?.nombre || ticket.branchName || 'Sucursal');
                    const active = ticket.active !== false;
                    return `
                        <article class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition">
                            <div class="h-44 bg-slate-100 overflow-hidden">
                                ${ticket.imageUrl ? `<img src="${ticket.imageUrl}" alt="${ticket.title}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-5xl text-emerald-200"><i class="fa-solid fa-ticket"></i></div>`}
                            </div>
                            <div class="p-5">
                                <div class="flex items-start justify-between gap-3 mb-2">
                                    <h3 class="text-lg font-black text-slate-900 leading-tight">${ticket.title || 'Sin título'}</h3>
                                    <span class="text-[10px] font-black uppercase px-2 py-1 rounded-lg ${active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${active ? 'Activo' : 'Inactivo'}</span>
                                </div>
                                <p class="text-sm text-slate-500 min-h-[40px]">${ticket.description || ''}</p>
                                <div class="mt-3 flex flex-wrap gap-2">
                                    <span class="text-[10px] font-black uppercase px-2 py-1 rounded-lg bg-slate-100 text-slate-700">${this.obtenerEtiquetaBeneficio(ticket.type)}</span>
                                    ${ticket.oneTimePerUser !== false ? '<span class="text-[10px] font-black uppercase px-2 py-1 rounded-lg bg-blue-50 text-blue-700">1 uso por usuario</span>' : '<span class="text-[10px] font-black uppercase px-2 py-1 rounded-lg bg-amber-50 text-amber-700">Uso multiple</span>'}
                                </div>
                                <div class="mt-4 flex items-center justify-between">
                                    <span class="font-black text-orange-500 text-lg">${ticket.type === 'free_points' ? `${Number(ticket.pointsValue || ticket.points || 0).toLocaleString('es-PY')} pts` : (ticket.productName || 'Beneficio')}</span>
                                    <span class="text-xs font-bold text-slate-400">${branchName}</span>
                                </div>
                                <div class="mt-5 flex gap-2">
                                    <button onclick="LinTicketsModule.editar('${ticket.id}')" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-blue-600 font-bold hover:bg-blue-600 hover:text-white transition"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="LinTicketsModule.eliminar('${ticket.id}')" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-red-600 font-bold hover:bg-red-600 hover:text-white transition"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');
            },

            abrirModal() {
                document.getElementById('modal-title').innerText = 'Nuevo LIN Ticket';
                document.getElementById('ticket-id').value = '';
                document.getElementById('ticket-titulo').value = '';
                document.getElementById('ticket-descripcion').value = '';
                document.getElementById('ticket-tipo').value = 'free_product';
                document.getElementById('ticket-producto').value = '';
                this.renderProductoSelect('');
                document.getElementById('ticket-puntos').value = '';
                document.getElementById('ticket-inicio').value = new Date().toISOString().slice(0, 10);
                document.getElementById('ticket-vencimiento').value = '';
                document.getElementById('ticket-sucursal').value = 'all';
                document.getElementById('ticket-activo').value = 'true';
                document.getElementById('ticket-uso-unico').checked = true;
                document.getElementById('ticket-condiciones').value = '';
                document.getElementById('ticket-imagen-url').value = '';
                document.getElementById('ticket-imagen-file').value = '';
                this.actualizarCamposBeneficio();
                document.getElementById('modal-ticket').classList.remove('hidden');
                document.getElementById('modal-ticket').classList.add('flex');
            },

            editar(id) {
                const ticket = this.tickets.find(t => t.id === id);
                if (!ticket) return;
                document.getElementById('modal-title').innerText = 'Editar LIN Ticket';
                document.getElementById('ticket-id').value = ticket.id;
                document.getElementById('ticket-titulo').value = ticket.title || '';
                document.getElementById('ticket-descripcion').value = ticket.description || '';
                document.getElementById('ticket-tipo').value = ticket.type || 'free_product';
                document.getElementById('ticket-producto').value = ticket.productName || ticket.productId || '';
                this.renderProductoSelect(ticket.productId || '');
                document.getElementById('ticket-puntos').value = Number(ticket.pointsValue || ticket.points || 0);
                document.getElementById('ticket-inicio').value = this.normalizarFechaInput(ticket.startDate);
                document.getElementById('ticket-vencimiento').value = this.normalizarFechaInput(ticket.endDate);
                document.getElementById('ticket-sucursal').value = ticket.branchId || 'all';
                document.getElementById('ticket-activo').value = ticket.active === false ? 'false' : 'true';
                document.getElementById('ticket-uso-unico').checked = ticket.oneTimePerUser !== false;
                document.getElementById('ticket-condiciones').value = ticket.conditions || '';
                document.getElementById('ticket-imagen-url').value = ticket.imageUrl || '';
                document.getElementById('ticket-imagen-file').value = '';
                this.actualizarCamposBeneficio();
                document.getElementById('modal-ticket').classList.remove('hidden');
                document.getElementById('modal-ticket').classList.add('flex');
            },

            cerrarModal() {
                document.getElementById('modal-ticket').classList.add('hidden');
                document.getElementById('modal-ticket').classList.remove('flex');
            },

            async subirImagen(file, id) {
                if (!file) return '';
                const permitidos = ['image/png', 'image/jpeg', 'image/webp', 'image/svg+xml'];
                if (!permitidos.includes(file.type)) throw new Error('Formato de imagen no permitido.');
                if (file.size > 5 * 1024 * 1024) throw new Error('La imagen no puede superar 5 MB.');

                
                const datosBase64 = await new Promise((resolve, reject) => {
                    const lector = new FileReader();
                    lector.onload = () => resolve(String(lector.result || ''));
                    lector.onerror = () => reject(new Error('No se pudo leer la imagen.'));
                    lector.readAsDataURL(file);
                });

                const respuesta = await NexusAPI.post(
                    '/uploads',
                    { carpeta: 'lin-tickets', nombre: file.name, mime: file.type, datosBase64 },
                    { ttl: 0, retries: 0 }
                );
                return (respuesta && respuesta.data && respuesta.data.url) || '';
            },

            async guardar(event) {
                event.preventDefault();
                const btn = document.getElementById('btn-guardar');
                const id = document.getElementById('ticket-id').value;
                const file = document.getElementById('ticket-imagen-file').files[0] || null;
                const branchId = document.getElementById('ticket-sucursal').value;
                const branch = this.branches.find(b => b.id === branchId);
                const type = document.getElementById('ticket-tipo').value || 'free_product';
                const pointsValue = type === 'free_points' ? Number(document.getElementById('ticket-puntos').value || 0) : 0;
                const productId = type === 'free_product' ? (document.getElementById('ticket-producto-id')?.value || '') : '';
                const selectedProduct = productId ? this.products.find(p => p.id === productId) : null;
                if (type === 'free_points' && pointsValue <= 0) {
                    this.toast('Carga una cantidad de puntos gratis mayor a cero.', 'error');
                    return;
                }
                if (type === 'free_product' && !selectedProduct) {
                    this.toast('Selecciona un producto habilitado como LIN Ticket gratis en Inventario.', 'error');
                    return;
                }
                const data = {
                    name: document.getElementById('ticket-titulo').value.trim(),
                    title: document.getElementById('ticket-titulo').value.trim(),
                    description: document.getElementById('ticket-descripcion').value.trim(),
                    type,
                    benefitType: type,
                    points: pointsValue,
                    pointsValue,
                    productId,
                    productName: selectedProduct ? selectedProduct.nombre : document.getElementById('ticket-producto').value.trim(),
                    productPrice: selectedProduct ? Number(selectedProduct.precio || 0) : 0,
                    productImageUrl: selectedProduct ? (selectedProduct.imagen || '') : '',
                    productCategory: selectedProduct ? (selectedProduct.categoria || '') : '',
                    branchId,
                    branchName: branchId === 'all' ? 'Todas las sucursales' : (branch?.nombre || branch?.branchName || ''),
                    appliesToAllBranches: branchId === 'all',
                    startDate: document.getElementById('ticket-inicio').value || null,
                    endDate: document.getElementById('ticket-vencimiento').value || null,
                    active: document.getElementById('ticket-activo').value === 'true',
                    oneTimePerUser: document.getElementById('ticket-uso-unico').checked,
                    conditions: document.getElementById('ticket-condiciones').value.trim(),
                    imageUrl: document.getElementById('ticket-imagen-url').value.trim(),
                    updatedAt: serverTimestamp()
                };
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando...`;
                try {
                    if (id) {
                        if (file) data.imageUrl = await this.subirImagen(file, id);

                        await NexusAPI.patch('/lin-tickets/' + encodeURIComponent(id), data, { ttl: 0, retries: 0 });
                    } else {

                        const respNuevo = await NexusAPI.post(
                            '/lin-tickets',
                            { ...data, createdAt: new Date().toISOString() },
                            { ttl: 0, retries: 0 }
                        );
                        const nuevoId = String((respNuevo && respNuevo.data && (respNuevo.data._id || respNuevo.data.id)) || '');
                        if (file && nuevoId) {
                            const imageUrl = await this.subirImagen(file, nuevoId);
                            await NexusAPI.patch('/lin-tickets/' + encodeURIComponent(nuevoId), { imageUrl }, { ttl: 0, retries: 0 });
                        }
                    }
                    this.toast('LIN Ticket guardado.');
                    this.cerrarModal();
                } catch (error) {
                    console.error(error);
                    this.toast(error.message || 'No se pudo guardar.', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Guardar`;
                }
            },

            async eliminar(id) {
                if (!confirm('¿Eliminar este LIN Ticket?')) return;
                try {
                    await deleteDoc(doc(db, 'linTickets', id));
                    this.toast('LIN Ticket eliminado.');
                } catch (error) {
                    console.error(error);
                    this.toast('No se pudo eliminar.', 'error');
                }
            },

            toast(message, type = 'success') {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').innerText = message;
                toast.classList.toggle('bg-red-500', type === 'error');
                toast.classList.toggle('bg-slate-900', type !== 'error');
                document.getElementById('toast-icon').className = type === 'error' ? 'fa-solid fa-triangle-exclamation text-white' : 'fa-solid fa-check text-emerald-400';
                toast.classList.remove('translate-x-[120%]');
                setTimeout(() => toast.classList.add('translate-x-[120%]'), 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => LinTicketsModule.init());
</script>
