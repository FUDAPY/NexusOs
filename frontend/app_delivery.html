    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, updateDoc, setDoc, query, where, orderBy, limit, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";


        const __app_id = "erp_lingroup";
        const __initial_auth_token = "admin_master_001";
        const firebaseConfig = {
            apiKey: "AIzaSyALS7-xIkcvY4MnSvBm44tzFk6cxyS14Eg",
            authDomain: "sys-pos-erp-lingroup.firebaseapp.com",
            projectId: "sys-pos-erp-lingroup",
            storageBucket: "sys-pos-erp-lingroup.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const functions = getFunctions(app, "us-central1");

        window.AppDelivery = {
            sesion: null,
            pedidosActivos: [],
            enviosHoy: 0,
            snapshotInicializado: false,
            permisoNotificacionSolicitado: false,
            mapaPedidoInstancia: null,
            marcadorPedidoInstancia: null,
            mapaPedidoActivoId: null,
            esAppNativa: false,
            listenersPushRegistrados: false,
            permisosUI: { notificaciones: 'pendiente', ubicacion: 'pendiente' },
            historialEntregas: [],
            ubicacionActual: null,
            ubicacionWatchId: null,
            inicializado: false,

            obtenerPluginsCapacitor: function() {
                return window.Capacitor && window.Capacitor.Plugins ? window.Capacitor.Plugins : {};
            },

            hashNotificacion: function(texto = '') {
                let hash = 0;
                const valor = String(texto || '');
                for (let i = 0; i < valor.length; i++) {
                    hash = ((hash << 5) - hash) + valor.charCodeAt(i);
                    hash |= 0;
                }
                return Math.abs(hash).toString(36);
            },

            init: function(usuarioFirebase) {
                if (this.inicializado) return;
                const sesionStr = localStorage.getItem('__pos_session');
                if(!sesionStr) return window.location.replace('index.html');
                this.sesion = JSON.parse(sesionStr);
                if (!usuarioFirebase || usuarioFirebase.uid !== this.sesion.uid) {
                    localStorage.removeItem('__pos_session');
                    return window.location.replace('index.html');
                }
                this.inicializado = true;
                this.esAppNativa = Boolean(window.Capacitor && typeof window.Capacitor.getPlatform === 'function' && window.Capacitor.getPlatform() !== 'web');

                if(this.sesion.rol !== 'delivery') return window.location.replace('index.html');

                document.getElementById('lbl-nombre-repartidor').innerText = this.sesion.nombre.split(' ')[0];
                document.getElementById('lbl-sucursal').innerText = this.sesion.sucursal;

                this.actualizarPanelPermisos();
                this.actualizarPermisoNotificaciones();
                this.actualizarPermisoUbicacion();
                if (this.esAppNativa) this.prepararPushNotifications();
                this.escucharPedidosEnTiempoReal();
            },

            mostrarToast: function(msg, tipo = 'success') {
                document.getElementById('toast-message').innerText = msg;
                const t = document.getElementById('toast');
                const icon = document.getElementById('toast-icon');
                if(tipo === 'error') { t.classList.replace('bg-slate-800', 'bg-red-600'); t.classList.replace('border-slate-700', 'border-red-500'); icon.className = "fa-solid fa-triangle-exclamation text-white mr-3 text-xl"; }
                else { t.classList.replace('bg-red-600', 'bg-slate-800'); t.classList.replace('border-red-500', 'border-slate-700'); icon.className = "fa-solid fa-circle-check text-green-400 mr-3 text-xl"; }
                t.classList.remove('-translate-y-[150%]'); t.classList.add('translate-y-0');
                setTimeout(() => { t.classList.remove('translate-y-0'); t.classList.add('-translate-y-[150%]'); }, 3000);
            },

            formatoMoneda: (num) => num.toLocaleString('es-PY'),

            actualizarPanelPermisos: function() {
                const notifOk = this.permisosUI.notificaciones === 'granted';
                const gpsOk = this.permisosUI.ubicacion === 'granted';
                const badge = document.getElementById('badge-permisos-delivery');
                const estadoNotif = document.getElementById('estado-permiso-notif-delivery');
                const estadoGps = document.getElementById('estado-permiso-gps-delivery');
                const btnNotif = document.getElementById('btn-permiso-notif-delivery');
                const btnGps = document.getElementById('btn-permiso-gps-delivery');

                if (estadoNotif) estadoNotif.innerText = notifOk ? 'Activas' : (this.permisosUI.notificaciones === 'denied' ? 'Bloqueadas' : 'Solicitar');
                if (estadoGps) estadoGps.innerText = gpsOk ? 'Activa' : (this.permisosUI.ubicacion === 'denied' ? 'Bloqueada' : 'Solicitar');
                if (btnNotif) btnNotif.className = `rounded-2xl border px-3 py-3 text-left transition ${notifOk ? 'border-emerald-300/40 bg-emerald-400/10' : 'border-white/10 bg-slate-900/20'}`;
                if (btnGps) btnGps.className = `rounded-2xl border px-3 py-3 text-left transition ${gpsOk ? 'border-emerald-300/40 bg-emerald-400/10' : 'border-white/10 bg-slate-900/20'}`;

                if (badge) {
                    const completos = Number(notifOk) + Number(gpsOk);
                    if (completos === 2) {
                        badge.innerText = 'Listo';
                        badge.className = 'px-3 py-1 rounded-full bg-emerald-400/15 border border-emerald-300/30 text-[10px] font-black uppercase tracking-[0.2em] text-emerald-100';
                    } else if (completos === 1) {
                        badge.innerText = 'Parcial';
                        badge.className = 'px-3 py-1 rounded-full bg-amber-400/15 border border-amber-300/30 text-[10px] font-black uppercase tracking-[0.2em] text-amber-100';
                    } else {
                        badge.innerText = 'Pendiente';
                        badge.className = 'px-3 py-1 rounded-full bg-amber-400/15 border border-amber-300/30 text-[10px] font-black uppercase tracking-[0.2em] text-amber-100';
                    }
                }
            },

            actualizarPermisoNotificaciones: async function() {
                let estado = 'pending';
                try {
                    if (this.esAppNativa) {
                        const { PushNotifications } = this.obtenerPluginsCapacitor();
                        if (PushNotifications) {
                            const permiso = await PushNotifications.checkPermissions();
                            estado = permiso.receive || 'prompt';
                        }
                    } else if ('Notification' in window) {
                        estado = Notification.permission || 'default';
                    }
                } catch (error) {
                    console.error('No se pudo leer permiso de notificaciones', error);
                }
                this.permisosUI.notificaciones = estado === 'default' ? 'pendiente' : estado;
                this.actualizarPanelPermisos();
                return this.permisosUI.notificaciones;
            },

            actualizarPermisoUbicacion: async function() {
                let estado = this.ubicacionActual ? 'granted' : 'pendiente';
                try {
                    if (navigator.permissions?.query) {
                        const permiso = await navigator.permissions.query({ name: 'geolocation' });
                        estado = permiso.state || estado;
                    }
                } catch (error) {
                    console.error('No se pudo leer permiso GPS del delivery', error);
                }
                this.permisosUI.ubicacion = estado;
                this.actualizarPanelPermisos();
                return estado;
            },

            solicitarPermisoNotificacionesUsuario: async function() {
                const confirmar = confirm('La app de delivery quiere avisarte inmediatamente cuando entren pedidos nuevos. Deseas permitir notificaciones?');
                if (!confirmar) return;
                try {
                    if (this.esAppNativa) {
                        await this.prepararPushNotifications();
                    } else if ('Notification' in window && Notification.permission !== 'granted') {
                        await Notification.requestPermission();
                    }
                } catch (error) {
                    console.error('No se pudo solicitar permiso de notificaciones delivery', error);
                }
                const estado = await this.actualizarPermisoNotificaciones();
                this.mostrarToast(estado === 'granted' ? 'Notificaciones activadas.' : 'Las notificaciones siguen bloqueadas.', estado === 'granted' ? 'success' : 'error');
            },

            solicitarPermisoUbicacionUsuario: async function() {
                const confirmar = confirm('La app de delivery quiere usar tu ubicacion en tiempo real para abrir rutas y ayudarte a navegar. Deseas permitirlo?');
                if (!confirmar) return false;
                return await this.iniciarSeguimientoUbicacion();
            },

            prepararPushNotifications: async function() {
                const { PushNotifications, LocalNotifications } = this.obtenerPluginsCapacitor();
                if (!PushNotifications || !this.sesion?.uid) return;

                try {
                    let permiso = await PushNotifications.checkPermissions();
                    if (permiso.receive === 'prompt') permiso = await PushNotifications.requestPermissions();
                    if (permiso.receive !== 'granted') {
                        await updateDoc(doc(db, "users", this.sesion.uid), { pushPermiso: permiso.receive || 'denied' });
                        return;
                    }

                    if (!this.listenersPushRegistrados) {
                        PushNotifications.addListener('registration', async token => {
                            try {
                                const tokenId = `native_delivery_${this.hashNotificacion(token.value)}`;
                                await updateDoc(doc(db, "users", this.sesion.uid), {
                                    pushTokenMovil: token.value,
                                    pushPlatform: window.Capacitor.getPlatform(),
                                    pushPermiso: 'granted',
                                    pushUpdatedAt: new Date().toISOString()
                                });
                                await setDoc(doc(db, "users", this.sesion.uid, "notificationTokens", tokenId), {
                                    token: token.value,
                                    platform: window.Capacitor.getPlatform(),
                                    source: 'capacitor-delivery',
                                    active: true,
                                    userAgent: navigator.userAgent || '',
                                    createdAt: serverTimestamp(),
                                    lastSeenAt: serverTimestamp()
                                }, { merge: true });
                            } catch (error) {
                                console.error('Error guardando token delivery', error);
                            }
                        });
                        PushNotifications.addListener('registrationError', error => console.error('Push registration error delivery', error));
                        PushNotifications.addListener('pushNotificationReceived', notification => {
                            this.mostrarToast(notification.title || 'Nuevo pedido');
                        });
                        PushNotifications.addListener('pushNotificationActionPerformed', () => window.focus());
                        this.listenersPushRegistrados = true;
                    }

                    if (typeof PushNotifications.createChannel === 'function') {
                        await PushNotifications.createChannel({
                            id: 'delivery_pedidos',
                            name: 'Delivery Pedidos',
                            description: 'Alertas de pedidos nuevos para delivery',
                            importance: 5,
                            visibility: 1,
                            sound: 'default'
                        });
                    }

                    if (LocalNotifications) {
                        const permisoLocal = await LocalNotifications.checkPermissions();
                        if (permisoLocal.display === 'prompt') await LocalNotifications.requestPermissions();
                    }

                    await PushNotifications.register();
                } catch (error) {
                    console.error('No se pudo inicializar push delivery', error);
                }
            },

            iniciarSeguimientoUbicacion: function() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        this.mostrarToast('Tu dispositivo no soporta ubicacion.', 'error');
                        resolve(false);
                        return;
                    }
                    if (this.ubicacionWatchId !== null) navigator.geolocation.clearWatch(this.ubicacionWatchId);
                    this.ubicacionWatchId = navigator.geolocation.watchPosition(
                        (position) => {
                            this.ubicacionActual = { lat: position.coords.latitude, lng: position.coords.longitude };
                            this.actualizarPermisoUbicacion();
                            resolve(true);
                        },
                        (error) => {
                            console.error(error);
                            this.actualizarPermisoUbicacion();
                            this.mostrarToast('Debes permitir la ubicacion del delivery.', 'error');
                            resolve(false);
                        },
                        { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 }
                    );
                });
            },

            emitirNotificacionSistema: async function(titulo, mensaje, tag = '') {
                try {
                    if (this.esAppNativa) {
                        const { LocalNotifications } = this.obtenerPluginsCapacitor();
                        if (LocalNotifications) {
                            await LocalNotifications.schedule({
                                notifications: [{
                                    id: Math.abs(String(tag || titulo).split('').reduce((acc, ch) => ((acc * 33) + ch.charCodeAt(0)) % 2147483647, 11)),
                                    title: titulo,
                                    body: mensaje,
                                    schedule: { at: new Date(Date.now() + 400) }
                                }]
                            });
                        }
                    }
                    if ('Notification' in window && Notification.permission === 'granted') {
                        const notif = new Notification(titulo, { body: mensaje, tag: tag || undefined });
                        setTimeout(() => notif.close(), 6000);
                    }
                } catch (error) {
                    console.error('No se pudo emitir notificacion delivery', error);
                }
            },

            notificarClienteEstado: async function(pedido, titulo, mensaje) {
                if (!pedido?.cliente || !titulo || !mensaje) return;
                try {
                    const callable = httpsCallable(functions, "notificarEstadoPedidoCliente");
                    await callable({
                        clienteId: pedido.cliente,
                        saleId: pedido.id,
                        titulo,
                        mensaje
                    });
                } catch (error) {
                    console.error('No se pudo notificar al cliente en segundo plano', error);
                }
            },

            obtenerMapaPedidoURL: function(pedido) {
                if (!pedido) return '';
                if (pedido.mapaDeliveryUrl) return pedido.mapaDeliveryUrl;
                if (pedido.gps && typeof pedido.gps.lat === 'number' && typeof pedido.gps.lng === 'number') {
                    return `https://www.openstreetmap.org/?mlat=${pedido.gps.lat}&mlon=${pedido.gps.lng}#map=18/${pedido.gps.lat}/${pedido.gps.lng}`;
                }
                if (pedido.direccionDelivery) {
                    return `https://www.openstreetmap.org/search?query=${encodeURIComponent(`${pedido.direccionDelivery}, ${this.sesion.sucursal}`)}`;
                }
                return '';
            },

            reproducirAlertaNuevoPedido: function() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.value = 760;
                    gain1.gain.value = 0.08;
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start();
                    osc1.stop(ctx.currentTime + 0.12);

                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.value = 1120;
                    gain2.gain.value = 0.08;
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(ctx.currentTime + 0.16);
                    osc2.stop(ctx.currentTime + 0.34);
                } catch (error) {
                    console.error('No se pudo reproducir alerta de delivery', error);
                }
                if (navigator.vibrate) navigator.vibrate([180, 100, 180]);
            },

            emitirAlertaNuevoPedido: function(pedido) {
                const nombreCliente = pedido?.nombreCliente || 'Cliente';
                this.mostrarToast(`Nuevo pedido de ${nombreCliente}`);
                this.reproducirAlertaNuevoPedido();
                this.emitirNotificacionSistema('Nuevo pedido para delivery', `${nombreCliente} - Gs. ${this.formatoMoneda(Number(pedido?.total || 0))}`, `delivery-${pedido.id}`);
            },

            escucharPedidosEnTiempoReal: function() {
                const rutaPrivada = `artifacts/${__app_id}/users/${__initial_auth_token}/sales`;


                const q = query(collection(db, rutaPrivada),
                    where("tipoTransaccion", "==", "app_delivery"),
                    where("estadoDelivery", "in", ["preparando", "recepcionado", "en_camino"])
                );

                onSnapshot(q, (snapshot) => {
                    const pedidosVisibles = [];
                    const pedidosNuevos = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();

                        if(!data.repartidor_id || data.repartidor_id === this.sesion.uid) {
                            pedidosVisibles.push({ id: doc.id, ...data });
                        }
                    });
                    if (this.snapshotInicializado) {
                        snapshot.docChanges().forEach((change) => {
                            if (change.type !== 'added') return;
                            const data = change.doc.data();
                            if (data.tipoTransaccion !== 'app_delivery' || data.estadoDelivery !== 'preparando') return;
                            if (data.repartidor_id && data.repartidor_id !== this.sesion.uid) return;
                            pedidosNuevos.push({ id: change.doc.id, ...data });
                        });
                    }

                    this.pedidosActivos = pedidosVisibles;


                    this.pedidosActivos.sort((a, b) => {
                        const peso = { en_camino: 0, recepcionado: 1, preparando: 2 };
                        return (peso[a.estadoDelivery] ?? 9) - (peso[b.estadoDelivery] ?? 9);
                    });

                    this.renderizarPedidos();
                    pedidosNuevos.forEach((pedido) => this.emitirAlertaNuevoPedido(pedido));
                    this.snapshotInicializado = true;
                });
            },

            renderizarPedidos: function() {
                const cont = document.getElementById('contenedor-rutas');
                if(this.pedidosActivos.length === 0) {
                    cont.innerHTML = `
                    <div class="flex justify-center items-center h-full text-slate-400 flex-col opacity-50 mt-20">
                        <i class="fa-solid fa-mug-hot text-7xl mb-4"></i>
                        <p class="font-bold text-xl">Sin pedidos pendientes</p>
                    </div>`;
                    return;
                }

                cont.innerHTML = this.pedidosActivos.map(p => {
                    const esMio = p.estadoDelivery === "en_camino" || p.estadoDelivery === "recepcionado";
                    const estaRecepcionado = p.estadoDelivery === "recepcionado";

                    const bgCard = esMio ? "bg-white border-2 border-blue-500 shadow-xl" : "bg-white border border-slate-200 shadow-sm opacity-90";
                    const resumenItems = p.items.map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
                    const telefonoCliente = p.telefonoCliente || '';
                    const tieneGPS = Boolean(p.gps && typeof p.gps.lat === 'number' && typeof p.gps.lng === 'number');
                    const referenciaGPS = p.referenciaGPS || (tieneGPS ? `${p.gps.lat.toFixed(6)}, ${p.gps.lng.toFixed(6)}` : '');
                    const metodoPedido = p.metodoPagoSolicitado || p.metodoPago || 'Por confirmar';
                    const tipoEntrega = p.tipoEntrega || 'Delivery';
                    const detallesPago = p.detallesPago || {};
                    const esTransferencia = String(metodoPedido).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase() === 'transferencia';
                    const pagoExtra = esTransferencia
                        ? `<p class="text-xs font-bold text-blue-700 mt-2 bg-white p-2 rounded-lg border border-blue-100"><i class="fa-solid fa-building-columns mr-1"></i>${detallesPago.banco || 'Ueno Bank'} · ${detallesPago.titular || 'Jose Lin'} · ${detallesPago.alias || '3.453.075'}</p>`
                        : '';

                    let botonesAccion = "";
                    if (!esMio) {

                        botonesAccion = `
                        <button onclick="event.stopPropagation(); AppDelivery.tomarPedido('${p.id}')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 rounded-xl shadow-md transition uppercase tracking-widest text-sm flex justify-center items-center gap-2 mt-4">
                            <i class="fa-solid fa-hand-holding-hand"></i> ACEPTAR VIAJE
                        </button>`;
                    } else {

                        botonesAccion = `
                        <div class="grid grid-cols-3 gap-2 mt-4">
                            <button onclick="event.stopPropagation(); AppDelivery.llamarCliente('${p.id}')" class="bg-emerald-100 text-emerald-700 hover:bg-emerald-200 font-black py-4 rounded-xl transition flex justify-center items-center border border-emerald-200">
                                <i class="fa-solid fa-phone text-xl"></i>
                            </button>
                            <button onclick="event.stopPropagation(); AppDelivery.abrirMapaPedido('${p.id}')" class="bg-blue-100 text-blue-600 hover:bg-blue-200 font-black py-4 rounded-xl transition flex justify-center items-center border border-blue-200">
                                <i class="fa-solid fa-location-arrow text-2xl"></i>
                            </button>
                            <button onclick="event.stopPropagation(); ${estaRecepcionado ? `AppDelivery.iniciarRuta('${p.id}')` : `AppDelivery.marcarEntregado('${p.id}', ${p.total}, '${p.cliente}')`}" class="${estaRecepcionado ? 'bg-blue-500 hover:bg-blue-600' : 'bg-green-500 hover:bg-green-600'} text-slate-900 font-black py-4 rounded-xl shadow-lg transition uppercase tracking-widest text-sm flex justify-center items-center gap-2">
                                <i class="fa-solid ${estaRecepcionado ? 'fa-route' : 'fa-check-double'}"></i> ${estaRecepcionado ? 'SALIR' : 'ENTREGADO'}
                            </button>
                        </div>`;
                    }

                    return `
                    <div class="${bgCard} p-5 rounded-3xl relative overflow-hidden mb-4 transition-all cursor-pointer active:scale-[0.99]" onclick="AppDelivery.abrirMapaPedido('${p.id}')">
                        ${esMio ? `<div class="absolute top-0 right-0 bg-blue-500 text-white text-[10px] font-black px-3 py-1 rounded-bl-xl uppercase tracking-widest">${estaRecepcionado ? 'Recepcionado' : 'Tu Ruta'}</div>` : `<div class="absolute top-0 right-0 bg-orange-500 text-white text-[10px] font-black px-3 py-1 rounded-bl-xl uppercase tracking-widest animate-pulse">Nuevo</div>`}

                        <div class="flex items-start gap-4 mb-3 pt-2">
                            <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 text-xl flex-shrink-0">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="flex-1">
                                <p class="font-black text-slate-800 text-lg leading-tight">${p.nombreCliente}</p>
                                <p class="text-orange-500 font-black text-lg font-mono">Gs. ${this.formatoMoneda(p.total)}</p>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-3">
                            <p class="text-xs font-bold text-slate-500 mb-1 uppercase tracking-widest"><i class="fa-solid fa-bag-shopping mr-1"></i> Pedido</p>
                            <p class="text-sm font-bold text-slate-800 leading-snug">${resumenItems}</p>
                        </div>

                        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100 mb-3">
                            <p class="text-xs font-bold text-emerald-700 mb-1 uppercase tracking-widest"><i class="fa-solid fa-wallet mr-1"></i> Pago y entrega</p>
                            <div class="flex flex-wrap gap-2">
                                <span class="bg-white text-emerald-700 text-[10px] font-black px-2 py-1 rounded-lg border border-emerald-200">${metodoPedido}</span>
                                <span class="bg-white text-slate-600 text-[10px] font-black px-2 py-1 rounded-lg border border-slate-200">${tipoEntrega}</span>
                            </div>
                            ${pagoExtra}
                        </div>

                        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                            <p class="text-xs font-bold text-blue-600 mb-1 uppercase tracking-widest"><i class="fa-solid fa-map-pin mr-1"></i> Destino</p>
                            <p class="text-sm font-bold text-slate-800 leading-snug mb-2">${p.direccionDelivery || 'Ubicacion GPS adjunta'}</p>
                            <div class="flex flex-wrap gap-2 mb-2">
                                <span class="bg-white text-slate-600 text-[10px] font-black px-2 py-1 rounded-lg border border-slate-200">
                                    <i class="fa-solid fa-phone mr-1 text-emerald-600"></i>${telefonoCliente || 'Sin telefono'}
                                </span>
                                ${tieneGPS ? `<span class="bg-white text-blue-700 text-[10px] font-black px-2 py-1 rounded-lg border border-blue-200"><i class="fa-solid fa-crosshairs mr-1"></i>${referenciaGPS}</span>` : ''}
                            </div>
                            ${p.notasCliente ? `<p class="text-xs text-slate-600 bg-white p-2 rounded-lg border border-slate-200 border-l-4 border-l-orange-500 italic"><i class="fa-solid fa-comment mr-1"></i> ${p.notasCliente}</p>` : ''}
                        </div>

                        ${botonesAccion}
                    </div>`;
                }).join('');
            },

            tomarPedido: async function(id) {
                try {
                    const rutaPrivada = `artifacts/${__app_id}/users/${__initial_auth_token}/sales`;
                    await updateDoc(doc(db, rutaPrivada, id), {
                        estadoDelivery: "recepcionado",
                        repartidor_id: this.sesion.uid,
                        repartidor_nombre: this.sesion.nombre
                    });
                    const pedido = this.pedidosActivos.find(x => x.id === id);
                    await this.notificarClienteEstado(
                        pedido,
                        "Pedido recepcionado",
                        `${this.sesion.nombre} recepciono tu pedido y saldra en breve.`
                    );
                    this.mostrarToast("Pedido recepcionado.");
                } catch(e) { console.error(e); this.mostrarToast("Error al tomar el pedido.", "error"); }
            },

            iniciarRuta: async function(id) {
                try {
                    const rutaPrivada = `artifacts/${__app_id}/users/${__initial_auth_token}/sales`;
                    await updateDoc(doc(db, rutaPrivada, id), { estadoDelivery: "en_camino" });
                    const pedido = this.pedidosActivos.find(x => x.id === id);
                    await this.notificarClienteEstado(
                        pedido,
                        "Tu pedido va en camino",
                        `${this.sesion.nombre} ya salio con tu pedido.`
                    );
                    this.mostrarToast("Ruta iniciada.");
                } catch(e) { console.error(e); this.mostrarToast("Error al iniciar ruta.", "error"); }
            },

            llamarCliente: function(id) {
                const pedido = this.pedidosActivos.find(x => x.id === id);
                const telefono = (pedido?.telefonoCliente || '').replace(/[^\d+]/g, '');
                if (!telefono) {
                    this.mostrarToast("El cliente no dejo telefono de contacto.", "error");
                    return;
                }
                window.open(`tel:${telefono}`, '_self');
            },

            obtenerMapaExternoURL: function(pedido) {
                if (!pedido) return '';
                if (pedido.gps && typeof pedido.gps.lat === 'number' && typeof pedido.gps.lng === 'number') {
                    const lat = pedido.gps.lat;
                    const lng = pedido.gps.lng;
                    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                        return `https://maps.apple.com/?daddr=${lat},${lng}`;
                    }
                    if (/Android/i.test(navigator.userAgent)) {
                        return `geo:${lat},${lng}?q=${lat},${lng}`;
                    }
                    return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
                }
                const mapaUrl = this.obtenerMapaPedidoURL(pedido);
                if (!mapaUrl) return '';
                return mapaUrl.replace('https://www.openstreetmap.org/search?query=', 'https://www.google.com/maps/search/?api=1&query=');
            },

            abrirNavegadorGPS: function(id) {
                const pedido = this.pedidosActivos.find(x => x.id === id);
                const mapaUrl = this.obtenerMapaExternoURL(pedido);
                if (mapaUrl) {
                    if (mapaUrl.startsWith('geo:')) {
                        window.location.href = mapaUrl;
                    } else {
                        window.open(mapaUrl, '_blank');
                    }
                } else {
                    this.mostrarToast("El cliente no proporciono ubicacion.", "error");
                }
            },

            abrirMapaPedido: function(id) {
                const pedido = this.pedidosActivos.find(x => x.id === id);
                if (!pedido) return this.mostrarToast("No encontré el pedido.", "error");
                if (!(pedido.gps && typeof pedido.gps.lat === 'number' && typeof pedido.gps.lng === 'number') || !window.L) {
                    return this.abrirNavegadorGPS(id);
                }

                this.mapaPedidoActivoId = id;
                const modal = document.getElementById('modal-mapa-delivery');
                const titulo = document.getElementById('delivery-map-title');
                if (titulo) titulo.innerText = pedido.nombreCliente || 'Ubicacion del pedido';
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }

                const { lat, lng } = pedido.gps;
                const contenedor = document.getElementById('delivery-map-modal');
                if (!contenedor) return;

                if (!this.mapaPedidoInstancia) {
                    this.mapaPedidoInstancia = window.L.map(contenedor, { zoomControl: true, attributionControl: true }).setView([lat, lng], 17);
                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(this.mapaPedidoInstancia);
                    this.marcadorPedidoInstancia = window.L.marker([lat, lng]).addTo(this.mapaPedidoInstancia);
                } else {
                    this.mapaPedidoInstancia.setView([lat, lng], 17);
                    if (this.marcadorPedidoInstancia) this.marcadorPedidoInstancia.setLatLng([lat, lng]);
                }
                setTimeout(() => this.mapaPedidoInstancia?.invalidateSize(), 120);
            },

            cerrarMapaPedido: function() {
                const modal = document.getElementById('modal-mapa-delivery');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            },

            abrirHistorial: async function() {
                const modal = document.getElementById('modal-historial-delivery');
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
                await this.cargarHistorialEntregas();
            },

            cerrarHistorial: function() {
                const modal = document.getElementById('modal-historial-delivery');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            },

            cargarHistorialEntregas: async function() {
                const lista = document.getElementById('lista-historial-delivery');
                if (!lista) return;
                lista.innerHTML = '<p class="text-center text-slate-400 text-sm font-bold py-6">Cargando historial...</p>';
                try {
                    const rutaPrivada = `artifacts/${__app_id}/users/${__initial_auth_token}/sales`;
                    let snap;
                    try {
                        snap = await getDocs(query(collection(db, rutaPrivada), where("repartidor_id", "==", this.sesion.uid), where("estadoDelivery", "==", "entregado"), orderBy("fechaEntrega", "desc"), limit(20)));
                    } catch (errorIndice) {
                        snap = await getDocs(query(collection(db, rutaPrivada), where("repartidor_id", "==", this.sesion.uid), where("estadoDelivery", "==", "entregado"), limit(30)));
                    }
                    this.historialEntregas = [];
                    snap.forEach((docSnap) => this.historialEntregas.push({ id: docSnap.id, ...(docSnap.data() || {}) }));
                    this.historialEntregas.sort((a, b) => {
                        const fechaA = new Date(a.fechaEntrega || a.fecha || 0).getTime();
                        const fechaB = new Date(b.fechaEntrega || b.fecha || 0).getTime();
                        return fechaB - fechaA;
                    });
                    if (!this.historialEntregas.length) {
                        lista.innerHTML = '<p class="text-center text-slate-400 text-sm font-bold py-6">Aun no tienes entregas registradas.</p>';
                        return;
                    }
                    lista.innerHTML = this.historialEntregas.map((pedido) => {
                        const fecha = new Date(pedido.fechaEntrega || pedido.fecha || Date.now());
                        const pago = pedido.estadoPago === 'pendiente' ? 'Pendiente de caja' : (pedido.metodoPagoSolicitado || pedido.metodoPago || 'Por confirmar');
                        const productos = Array.isArray(pedido.items) ? pedido.items.map(item => `${item.cantidad || 1}x ${item.nombre || 'Producto'}`).join(', ') : 'Sin detalle';
                        return `
                            <div class="rounded-3xl border border-slate-200 bg-white px-4 py-4 shadow-sm">
                                <div class="flex items-start justify-between gap-3">
                                    <div>
                                        <p class="text-sm font-black text-slate-800">${pedido.nombreCliente || 'Cliente'}</p>
                                        <p class="text-[11px] font-bold text-slate-500 mt-1">${DateTime24.formatDate24(fecha)} - ${DateTime24.formatTime24(fecha)}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-black text-slate-800 font-mono">Gs. ${this.formatoMoneda(Number(pedido.total || 0))}</p>
                                        <p class="text-[10px] font-black uppercase tracking-[0.18em] text-blue-600 mt-1">${pago}</p>
                                    </div>
                                </div>
                                <div class="mt-3 rounded-2xl bg-slate-50 border border-slate-200 px-3 py-3">
                                    <p class="text-[10px] font-black uppercase tracking-[0.18em] text-slate-400 mb-1">Detalle</p>
                                    <p class="text-sm font-bold text-slate-700 leading-snug">${productos}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                } catch (error) {
                    console.error(error);
                    lista.innerHTML = '<p class="text-center text-red-400 text-sm font-bold py-6">No se pudo cargar el historial.</p>';
                }
            },

            marcarEntregado: async function(id, totalCobrado, clienteId) {
                const pedido = this.pedidosActivos.find(x => x.id === id);
                const esCreditoCuenta = ['credito', 'crédito'].includes(String(pedido?.metodoPagoSolicitado || pedido?.metodoPago || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase());
                const mensajeConfirmacion = esCreditoCuenta
                    ? "Confirmas que entregaste el pedido? Como el cliente eligio cargar a credito, quedara confirmado a su cuenta."
                    : "Confirmas que entregaste el pedido? Quedara pendiente en caja hasta que el cajero confirme si fue efectivo o transferencia.";
                if(!confirm(mensajeConfirmacion)) return;

                try {
                    const batch = writeBatch(db);
                    const rutaPrivada = `artifacts/${__app_id}/users/${__initial_auth_token}/sales`;

                    batch.update(doc(db, rutaPrivada, id), {
                        estadoDelivery: "entregado",
                        estadoCocina: "despachado",
                        estadoPago: esCreditoCuenta ? "pagado" : "pendiente",
                        requiereConfirmacionCaja: !esCreditoCuenta,
                        confirmadoPorCaja: esCreditoCuenta,
                        fechaConfirmacionCaja: esCreditoCuenta ? new Date().toISOString() : null,
                        fechaEntrega: new Date().toISOString()
                    });

                    await batch.commit();
                    await this.notificarClienteEstado(
                        pedido,
                        esCreditoCuenta ? "Pedido entregado" : "Entrega registrada",
                        esCreditoCuenta
                            ? "Tu pedido fue entregado y cargado a tu cuenta de credito."
                            : "Tu pedido fue entregado y queda pendiente de confirmacion en caja."
                    );

                    this.enviosHoy++;
                    document.getElementById('lbl-envios-hoy').innerText = this.enviosHoy;
                    this.mostrarToast(esCreditoCuenta
                        ? "Entrega registrada y cargada a la cuenta de credito del cliente."
                        : "Entrega registrada. El cajero debe confirmar el cobro.");

                } catch(e) { console.error(e); this.mostrarToast("Error al procesar la entrega.", "error"); }
            },

            cerrarSesion: async function() { await signOut(auth); localStorage.removeItem('__pos_session'); window.location.replace('index.html'); }
        };

        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    localStorage.removeItem('__pos_session');
                    window.location.replace('index.html');
                    return;
                }
                AppDelivery.init(user);
            });
        });
    </script>
</body>
</html>
